name: 24/7 BountyRadar Feed Refresh

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run unit tests
        run: npm test

      - name: Refresh live bounty feed & README leaderboard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/generate-feed.mjs

      - name: Commit updated feed if changed
        run: |
          git config user.name "bounty-radar[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/feed.json README.md
          if ! git diff --cached --quiet; then
            git commit -m "chore(feed): auto-refresh 24/7 bounty radar snapshot"
            git push
          else
            echo "No feed changes to commit."
          fi
